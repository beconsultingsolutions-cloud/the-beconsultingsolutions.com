# Netlify config for the public website. Set the project's Base directory to `deploy`.
# (wrangler.toml + functions/ are the Cloudflare Pages equivalent and are not used on Netlify.)
[build]
  publish = "."
  command = "echo 'static site, no build'"

[functions]
  directory = "netlify/functions"

# Keep config and source files out of the public site.
[[redirects]]
  from = "/functions/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/wrangler.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
