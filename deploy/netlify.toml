[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # @netlify/blobs 11 (atomic rate limiting) needs Node >= 22.12.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Environment variables (Site configuration → Environment variables):
#   RESEND_API_KEY     required
#   TO_EMAIL           beconsultingsolutions@gmail.com
#   FROM_EMAIL         BECS Website <hello@thebeconsultingsolution.com>
#   ALLOWED_ORIGINS    https://thebeconsultingsolution.com,https://www.thebeconsultingsolution.com
#   AGREEMENT_LIVE     false  (set "true" only after legal review)
#   AGREEMENT_VERSION  draft-0.1
#   CRM_WEBHOOK_URL    optional

# Keep source and config files out of the public site.
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
